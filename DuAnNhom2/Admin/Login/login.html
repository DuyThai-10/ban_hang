
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin - WEB SHOP</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

 
<div class="khung-dang-nhap">
    <h1>WEB SHOP</h1>
    <h2 id="tieuDe">Đăng nhập quản trị viên</h2>

    <!-- FORM ĐĂNG NHẬP -->
    <form id="formDangNhap">

        <label>Tên đăng nhập</label>
        <input type="text" id="tenDangNhap"
               placeholder="Nhập tên đăng nhập" required>

        <label>Mật khẩu</label>
        <input type="password" id="matKhau"
               placeholder="Nhập mật khẩu" required>

        <button type="submit">Đăng nhập</button>

        <p class="chuyen-doi">
            Chưa có tài khoản?
            <a href="#" id="sangDangKy">Đăng ký ngay</a>
        </p>
    </form>

    <!-- FORM ĐĂNG KÝ -->
    <form id="formDangKy" style="display:none;">

        <label>Họ và tên</label>
        <input type="text" id="hoTen"
               placeholder="Nhập họ và tên" required>

        <label>Tên đăng nhập</label>
        <input type="text" id="tenDangKy"
               placeholder="Tạo tên đăng nhập" required>

        <label>Mật khẩu</label>
        <input type="password" id="matKhauDangKy"
               placeholder="Tạo mật khẩu" required>

        <label>Xác nhận mật khẩu</label>
        <input type="password" id="xacNhanMatKhau"
               placeholder="Nhập lại mật khẩu" required>

        <button type="submit">Đăng ký</button>

        <p class="chuyen-doi">
            Đã có tài khoản?
            <a href="#" id="sangDangNhap">Đăng nhập</a>
        </p>
    </form>

    <p id="thongBao"></p>
</div>


    <script src="login.js"></script>
</body>
</html>
