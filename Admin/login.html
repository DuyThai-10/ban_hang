<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 10px;
            width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #0f172a;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #475569;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            outline: none;
            font-size: 15px;
        }
        .form-group input:focus {
            border-color: #0D9295;
        }
        .btn-login {
            width: 100%;
            background: #0D9295;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-login:hover {
            background: #0b7a7c;
        }
        .back-home {
            text-align: center;
            margin-top: 20px;
        }
        .back-home a {
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }
        .back-home a:hover {
            color: #0D9295;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>ADMIN LOGIN</h2>
        <form id="admin-login-form" onsubmit="xuLyDangNhapAdmin(event)">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Tên đăng nhập:</label>
                <input type="text" id="admin-user" required value="admin">
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Mật khẩu:</label>
                <input type="password" id="admin-pass" required value="123456">
            </div>
            <button type="submit" class="btn-login">Đăng Nhập</button>
        </form>
        <div class="back-home">
            <a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Quay lại trang chủ User</a>
        </div>
    </div>

    <script>
        function xuLyDangNhapAdmin(event) {
            event.preventDefault();

            let uInput = document.getElementById("admin-user").value.trim();
            let pInput = document.getElementById("admin-pass").value.trim();

            // Ép buộc thiết lập lại tài khoản chuẩn xác vào localStorage mỗi khi bấm đăng nhập
            const adminChuan = [{ tenDangNhap: "admin", matKhau: "123456" }];
            localStorage.setItem("danhSachAdmin", JSON.stringify(adminChuan));

            // Kiểm tra khớp thông tin
            let adminTimThay = adminChuan.find(ad => ad.tenDangNhap === uInput && ad.matKhau === pInput);

            if (adminTimThay) {
                localStorage.setItem("currentAdmin", JSON.stringify(adminTimThay));
                alert("Đăng nhập trang quản trị thành công!");
                window.location.href = "admin.html"; // Chuyển vào trang quản trị
            } else {
                alert("Sai tên đăng nhập hoặc mật khẩu quản trị!");
            }
        }
    </script>
</body>
</html>
